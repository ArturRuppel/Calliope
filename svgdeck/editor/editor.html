<!DOCTYPE html>
<html lang="en" data-home="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>{{DECK}} · Calliope</title>
<meta name="apple-mobile-web-app-title" content="Calliope">
<link rel="icon" href="/editor/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/editor/apple-touch-icon.png">
<link rel="stylesheet" href="/editor/harmonia/harmonia-fonts.css">
<link rel="stylesheet" href="/editor/harmonia/harmonia.css">
<link rel="stylesheet" href="/editor/editor.css">
<link rel="stylesheet" href="/editor/colors.css">
</head>
<body data-deck="{{DECK}}">
<header class="bar">
  <a class="btn icon-btn" id="back" href="/" title="All decks" aria-label="All decks"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
  <button class="btn icon-btn" id="toggle-strip" title="Slides" aria-label="Slides" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 3v18"/></svg></button>
  <button class="doc-btn" id="doc-menu-btn" aria-haspopup="menu" aria-expanded="false" title="Deck: snapshots, history, export, settings">
    <span class="doc-text"><span class="deck-title" id="deck-title"></span>
      <span class="doc-sub"><span id="slide-pos"></span> · <span class="status" id="status">Loading…</span></span></span>
    <svg class="icon small" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <span class="spacer"></span>
  <button class="btn icon-btn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="icon" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="btn icon-btn" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="icon" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <span class="vrule"></span>
  <div class="view-bar" id="view-bar">
    <button class="btn icon-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
    <button class="btn zoom-fit" id="zoom-fit" title="Fit slide"><span id="zoom-label">Fit</span></button>
    <button class="btn icon-btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
    <span class="view-toggles" id="view-toggles"></span>
  </div>
  <span class="vrule"></span>
  <button class="btn icon-btn" id="toggle-panel" title="Inspector" aria-label="Inspector" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM15 3v18"/></svg></button>
  <button class="btn primary" id="present" title="Present from this slide"><svg class="icon small filled" viewBox="0 0 24 24"><path d="M6 4v16l14-8z"/></svg><span class="label">Present</span></button>
</header>
<main>
  <nav class="rail" id="tools" aria-label="Tools"></nav>
  <aside class="strip" id="strip">
    <div class="strip-actions">
      <button class="btn strip-add" id="slide-add" title="New slide after this one"><svg class="icon small" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Slide</button>
      <button class="btn icon-btn dots" id="slide-menu-btn" title="Slide actions" aria-label="Slide actions" aria-haspopup="menu" aria-expanded="false"><svg class="icon small" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
    </div>
    <div class="menu slide-menu" id="slide-menu" role="menu" hidden>
      <button role="menuitem" id="slide-dup">Duplicate slide</button>
      <button role="menuitem" id="slide-up">Move up</button>
      <button role="menuitem" id="slide-down">Move down</button>
      <button role="menuitem" class="danger" id="slide-del">Delete slide</button>
    </div>
    <ol class="thumbs" id="thumbs"></ol>
  </aside>
  <div class="stage-wrap" id="stage-wrap">
    <section class="stage" id="stage"></section>
    <div class="sel-bar" id="sel-bar" hidden>
      <div class="sel-row" id="sel-row" role="toolbar" aria-label="Selection"></div>
      <div class="sel-row" id="align-row" role="toolbar" aria-label="Align" hidden></div>
    </div>
    <div class="ink-bar floating" id="ink-bar" hidden></div>
  </div>
  <aside class="inspector" id="inspector">
    <div class="tabs" role="tablist" id="inspector-tabs">
      <button role="tab" data-tab="design" aria-selected="true">Design</button>
      <button role="tab" data-tab="objects" aria-selected="false">Objects</button>
      <button role="tab" data-tab="builds" aria-selected="false">Builds</button>
      <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
    </div>
    <div class="tab-body panel" id="panel" data-tab-body="design"></div>
    <div class="tab-body" id="objects-mount" data-tab-body="objects builds" hidden></div>
    <div class="tab-body" id="notes-mount" data-tab-body="notes" hidden></div>
  </aside>
</main>
<div class="menu doc-menu" id="doc-menu" role="menu" hidden></div>
<dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
  <header><h2 id="settings-title"></h2><button class="btn icon-btn" id="settings-close" aria-label="Close">×</button></header>
  <div class="panel settings-body" id="settings-body"></div>
</dialog>
<div class="breadcrumb" id="breadcrumb" hidden>In a group · <button class="link" id="exit-group">leave group</button></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="media-file" accept="image/*,video/*" multiple hidden>
<input type="file" id="replace-file" accept="image/*,video/*" hidden>
<input type="file" id="font-file" accept=".otf,.ttf" hidden>
<script src="/editor/movie-range.js"></script>
<script type="module" src="/editor/main.js"></script>
</body>
</html>
