<!DOCTYPE html>
<html lang="en" data-home="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calliope</title>
<meta name="apple-mobile-web-app-title" content="Calliope">
<link rel="icon" href="/editor/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/editor/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/editor/harmonia/harmonia-fonts.css">
<link rel="stylesheet" href="/editor/harmonia/harmonia.css">
<style>
  /* The Modernist system, as in the editor: flat, square, near-black ink on cool grey, one teal accent. */
  :root { --ink: var(--hm-ink); --muted: var(--hm-dim); --line: var(--hm-divider); --accent: var(--hm-home);
    --accent-600: var(--hm-home-hover); --n200: var(--hm-n200); --bg: var(--hm-ground); --danger: var(--hm-danger);
    font: 15px/1.4 var(--hm-font); color: var(--ink); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); }
  header { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; border-bottom: 2px solid var(--line); }
  header h1 { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin: 0; flex: 1; }
  header h1 .mark { width: 32px; height: 32px; flex: none; }
  main { max-width: 60rem; margin: 0 auto; padding: 8px 24px 60px; }
  .deck { display: flex; align-items: center; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .deck .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .deck strong { font-size: 17px; line-height: 1.2; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deck small { color: var(--muted); font-size: 12px; }
  a.btn, button { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 0;
    border: 2px solid var(--ink); background: none; color: var(--ink); text-decoration: none; font: inherit;
    font-weight: 800; font-size: 13px; cursor: pointer; }
  a.btn:hover, button:hover { background: var(--n200); }
  a.btn.primary, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 96px; }
  a.btn.primary:hover, button.primary:hover { background: var(--accent-600); border-color: var(--accent-600); }
  form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; padding-top: 16px; border-top: 2px solid var(--line); }
  form h2 { width: 100%; margin: 0 0 4px; font-size: 18px; font-weight: 800; }
  input { height: 44px; padding: 0 12px; border: 2px solid var(--line); border-radius: 0; background: #fff; font: inherit; flex: 1; min-width: 10rem; }
  input:focus { outline: none; border-color: var(--ink); }
  .error { color: var(--danger); width: 100%; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.danger.armed { background: var(--danger); color: #fff; }
  #deleted:empty { display: none; }
  #deleted { margin-top: 32px; padding-top: 16px; border-top: 2px solid var(--line); }
  #deleted h2 { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
  #deleted .deck strong { color: var(--muted); }
  .deck { flex-wrap: wrap; }
  .deck .row-error:empty, .deck .inline:empty { display: none; }
  .deck .row-error { flex-basis: 100%; color: var(--danger); font-size: 13px; }
  .deck .inline { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .deck .inline label { width: 100%; font-size: 13px; color: var(--muted); }
  .deck .inline input { flex: 1; }
</style>
</head>
<body>
<header><h1><img class="mark" src="/editor/icon.svg" alt="">Calliope</h1><a class="btn primary" href="#new" onclick="document.querySelector('#new input').focus()">New deck</a></header>
<main>
  <p class="error" id="status"></p>
  <div id="decks">Loading…</div>
  <section id="deleted"></section>
  <form id="new">
    <h2>New deck</h2>
    <input name="title" placeholder="Title, e.g. Group meeting" required>
    <input name="name" placeholder="Folder name, e.g. 2026-10-01_group_meeting" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]*" required>
    <button class="primary">Create</button>
    <div class="error" id="error"></div>
  </form>
</main>
<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const status = document.getElementById("status");
  /** The server's message for a failed response; the body need not be JSON. */
  async function errorText(r, fallback) {
    try {
      const detail = (await r.json()).detail;
      if (typeof detail === "string" && detail) return detail;
    } catch (e) { /* not JSON */ }
    return `${fallback} (${r.status} ${r.statusText})`.replace(/ \)$/, ")");
  }
  async function getJSON(url, what) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(await errorText(r, `Could not load ${what}`));
    return r.json();
  }
  async function load() {
    // Both lists are fetched before either is shown, so a deck never shows
    // in both (or neither) while one of them is still loading.
    const [listed, trashed] = await Promise.allSettled([getJSON("/api/decks", "the decks"), getJSON("/api/trash", "recently deleted decks")]);
    if (listed.status === "rejected") {
      document.getElementById("decks").textContent = "The decks could not be loaded. Reload the page to try again.";
      status.textContent = listed.reason.message;
      return;
    }
    const decks = listed.value;
    document.getElementById("decks").innerHTML = decks.length ? decks.map((d) => `
      <div class="deck"><div class="info"><strong>${esc(d.title)}</strong>
        <small>${esc(d.name)} · ${d.slides} slide${d.slides === 1 ? "" : "s"} · edited ${new Date(d.modified * 1000).toLocaleString()}</small></div>
        <a class="btn primary" href="/edit/${encodeURIComponent(d.name)}">Edit</a>
        <a class="btn" href="/d/${encodeURIComponent(d.name)}/" target="_blank">Present</a>
        <button data-rename="${esc(d.name)}" title="Rename the deck's folder">Rename</button>
        <button data-duplicate="${esc(d.name)}" title="Make a copy of the deck">Duplicate</button>
        <button class="danger" data-delete="${esc(d.name)}">Delete</button>
        <div class="inline"></div><div class="row-error" role="alert"></div></div>`).join("")
      : "<p>No decks yet.</p>";
    if (trashed.status === "rejected") {
      document.getElementById("deleted").innerHTML = "";
      status.textContent = trashed.reason.message;
      return;
    }
    const deleted = trashed.value;
    document.getElementById("deleted").innerHTML = deleted.length ? `<h2>Recently deleted</h2>` + deleted.map((d) => `
      <div class="deck"><div class="info"><strong>${esc(d.title)}</strong>
        <small>${esc(d.name)} · deleted ${new Date(d.deleted * 1000).toLocaleString()}</small></div>
        <button data-restore="${esc(d.token)}" data-name="${esc(d.name)}">Restore</button>
        <div class="inline"></div><div class="row-error" role="alert"></div></div>`).join("") : "";
  }

  const NAME_PATTERN = "[A-Za-z0-9][A-Za-z0-9_.\\-]*";
  /** A small form in a deck's row asking for a folder name; submit(name)
   *  returns an error message, or nothing when it worked. */
  function askName(rowEl, label, value, action, submit) {
    const box = rowEl.querySelector(".inline"), error = rowEl.querySelector(".row-error");
    box.innerHTML = `<label>${esc(label)}</label><input name="name" pattern="${NAME_PATTERN}" required aria-label="${esc(label)}">` +
      `<button type="button" class="primary" data-act="ok">${esc(action)}</button><button type="button" data-act="cancel">Cancel</button>`;
    const input = box.querySelector("input");
    input.value = value;
    const go = async () => {
      const name = input.value.trim();
      if (!name || !input.checkValidity()) { error.textContent = "Use letters, digits, '.', '_' and '-' (starting with a letter or digit)."; return; }
      box.querySelector("[data-act=ok]").disabled = true;
      const message = await submit(name);
      if (message) {
        error.textContent = message;
        box.querySelector("[data-act=ok]").disabled = false;
        input.focus();
      }
    };
    box.querySelector("[data-act=ok]").onclick = go;
    box.querySelector("[data-act=cancel]").onclick = () => { box.innerHTML = ""; error.textContent = ""; };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); go(); }
      else if (e.key === "Escape") { box.innerHTML = ""; error.textContent = ""; }
    });
    input.focus();
    input.select();
  }

  /** POST JSON; the error message, or "" when it worked. */
  async function post(url, body, fallback) {
    try {
      const r = await fetch(url, body === undefined ? { method: "POST" }
        : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.ok) return "";
      return Object.assign(new String(await errorText(r, fallback)), { status: r.status });
    } catch (err) {
      return `${fallback}: ${err.message}`;
    }
  }

  async function rename(rowEl, name) {
    askName(rowEl, `New folder name for ${name}`, name, "Rename", async (to) => {
      if (to === name) { rowEl.querySelector(".inline").innerHTML = ""; return ""; }
      const message = await post(`/api/decks/${encodeURIComponent(name)}/rename`, { name: to }, "Could not rename the deck");
      if (!message) await load();
      return String(message);
    });
  }

  async function duplicate(rowEl, name) {
    const button = rowEl.querySelector("[data-duplicate]");
    button.disabled = true;
    const message = await post(`/api/decks/${encodeURIComponent(name)}/duplicate`, {}, "Could not duplicate the deck");
    button.disabled = false;
    if (message) rowEl.querySelector(".row-error").textContent = String(message);
    else await load();
  }

  /** Restore a deleted deck; when its name is taken, ask for another one. */
  async function restoreDeck(rowEl, token, name) {
    const message = await post(`/api/trash/${encodeURIComponent(token)}/restore`, undefined, "Could not restore the deck");
    if (!message) { status.textContent = ""; await load(); return; }
    if (message.status !== 409) { rowEl.querySelector(".row-error").textContent = String(message); return; }
    askName(rowEl, `A deck named ${name} exists. Restore it under another name:`, `${name}-restored`, "Restore", async (to) => {
      const again = await post(`/api/trash/${encodeURIComponent(token)}/restore`, { name: to }, "Could not restore the deck");
      if (!again) { status.textContent = ""; await load(); }
      return String(again);
    });
  }
  // Two taps instead of confirm(): a modal dialog mid-gesture loses focus on iPad.
  let armed = null;
  function disarm() {
    if (!armed) return;
    armed.classList.remove("armed");
    armed.textContent = "Delete";
    armed = null;
  }
  document.addEventListener("click", async (e) => {
    const del = e.target.closest("[data-delete]"), restore = e.target.closest("[data-restore]");
    const ren = e.target.closest("[data-rename]"), dup = e.target.closest("[data-duplicate]");
    if (ren || dup) {
      disarm();
      const rowEl = (ren || dup).closest(".deck");
      rowEl.querySelector(".row-error").textContent = "";
      if (ren) rename(rowEl, ren.dataset.rename);
      else await duplicate(rowEl, dup.dataset.duplicate);
      return;
    }
    if (restore) {
      disarm();
      const rowEl = restore.closest(".deck");
      rowEl.querySelector(".row-error").textContent = "";
      await restoreDeck(rowEl, restore.dataset.restore, restore.dataset.name);
      return;
    }
    if (del && del !== armed) {
      disarm();
      armed = del;
      del.classList.add("armed");
      del.textContent = "Tap again to delete";
      return;
    }
    if (!del) { disarm(); return; }
    armed = null;
    const [url, init, fallback] = [`/api/decks/${encodeURIComponent(del.dataset.delete)}`, { method: "DELETE" }, "Could not delete the deck"];
    let message = "";
    try {
      const r = await fetch(url, init);
      if (!r.ok) message = await errorText(r, fallback);
    } catch (err) {
      message = `${fallback}: ${err.message}`;
    }
    status.textContent = message;
    await load();
  });
  const form = document.getElementById("new");
  form.title.addEventListener("input", () => {
    if (form.name.dataset.touched) return;
    const d = new Date().toISOString().slice(0, 10);
    form.name.value = `${d}_${form.title.value.trim().replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "")}`;
  });
  form.name.addEventListener("input", () => { form.name.dataset.touched = "1"; });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const error = document.getElementById("error");
    try {
      const r = await fetch("/api/decks", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: form.name.value, title: form.title.value }) });
      if (r.ok) location.href = `/edit/${encodeURIComponent(form.name.value)}`;
      else error.textContent = await errorText(r, "Could not create the deck");
    } catch (err) {
      error.textContent = `Could not create the deck: ${err.message}`;
    }
  });
  load().catch((e) => { status.textContent = e.message; });
</script>
</body>
</html>
