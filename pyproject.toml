[project]
name = "svgdeck"
version = "0.1.0"
description = "Draw slide decks in the browser, present them with movies, export them as standalone offline HTML"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "anyio",
    "fonttools[woff]",
]

[project.optional-dependencies]
import = ["lxml"]
pdf = ["playwright"]
dev = ["pytest", "playwright", "lxml", "pillow", "httpx", "pypdf"]

[project.scripts]
svgdeck = "svgdeck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["svgdeck*"]

[tool.setuptools.package-data]
svgdeck = ["player/*", "editor/*"]
